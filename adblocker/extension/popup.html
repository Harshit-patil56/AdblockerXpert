<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />

  <link rel="stylesheet" href="./popup.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" />
</head>

<body>
  <div class="iphone-8-1">
    <img class="adblock-removebg-preview-1-icon" alt="" src="./public/adblockremovebgpreview-1@2x.png" />

    <header class="root-frame">
      <div class="adblock-preview">
        <img class="refresh-1-icon" loading="eager" alt="" src="./public/refresh-1@2x.png" />

        <img class="settings-gear-icon-1" loading="eager" alt="" src="./public/settingsgearicon-1@2x.png" />
      </div>
    </header>
    <div class="secondary-frame">
      <h2 class="blocked-0">Blocked: 0</h2>
      <div class="total-0">Total: 0</div>
      <h1 class="Estimate">E͟s͟t͟i͟m͟a͟t͟e͟d͟</h1>
    </div>
    <section class="upgrade-call-to-action">
      <div class="tertiary-frame">
        <div class="center">
          
          <label class="switch">
            <input class="switch-input" type="checkbox" />
            <span class="switch-label" data-on="On" data-off="Off"></span> 
            <span class="switch-handle"></span> 
          </label>

          <p>Ads Blocked: <span id="adsBlocked"></span></p>
          <p>Data Saved: <span id="dataSaved"></span></p>
          
        </div>
        <ul id="activate">
          <ul>
            <script src="popup.js">

            </script>

      </div>
      <footer class="rectangle-shape"></footer>
    </section>
  </div>
</body>

</html>
